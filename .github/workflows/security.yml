name: Security analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 2"

permissions:
  contents: read

concurrency:
  group: dbi-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Block high dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify registry signatures and attestations
        run: npm audit signatures
      - name: Enforce cyber governance contracts
        run: npm run verify:cyber
      - name: Build CycloneDX SBOM
        run: mkdir -p test-results/security && npm sbom --sbom-format=cyclonedx > test-results/security/defense-budget-intelligence.sbom.cdx.json
      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyber-policy-evidence
          path: test-results/security
          if-no-files-found: warn

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build release container
        run: docker build --tag dbi-security-scan:${{ github.sha }} .
      - name: Build PostgreSQL container
        run: docker build --file Dockerfile.postgres --tag dbi-postgres-security-scan:${{ github.sha }} .
      - name: Prepare security evidence directory
        run: mkdir -p test-results/security
      - name: Scan release container
        id: application-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dbi-security-scan:${{ github.sha }}
          format: sarif
          output: test-results/security/trivy.sarif
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan PostgreSQL container
        id: postgresql-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dbi-postgres-security-scan:${{ github.sha }}
          format: sarif
          output: test-results/security/trivy-postgres.sarif
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload application container findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: test-results/security/trivy.sarif
          category: application-container
      - name: Upload PostgreSQL container findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: test-results/security/trivy-postgres.sarif
          category: postgresql-container
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-evidence
          path: test-results/security
          if-no-files-found: warn
      - name: Block vulnerable container release
        if: always() && (steps.application-scan.outcome == 'failure' || steps.postgresql-scan.outcome == 'failure')
        run: exit 1

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
