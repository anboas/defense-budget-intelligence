name: Refresh daily intelligence snapshots

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Preserve previous verified snapshots
        run: |
          cp src/data/budget-intelligence.json "${RUNNER_TEMP}/previous-budget-intelligence.json"
          cp src/data/source-health.json "${RUNNER_TEMP}/previous-source-health.json"
          cp src/data/sam-opportunities.json "${RUNNER_TEMP}/previous-sam-opportunities.json"
          cp src/data/usaspending-subawards.json "${RUNNER_TEMP}/previous-usaspending-subawards.json"
          cp src/data/contract-monitor.json "${RUNNER_TEMP}/previous-contract-monitor.json"
      - name: Refresh official sources
        env:
          BUDGET_SOURCE_DIR: ${{ runner.temp }}/defense-budget-intelligence/budget
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: npm run source:refresh
      - name: Build refresh delta
        env:
          PREVIOUS_BUDGET_FILE: ${{ runner.temp }}/previous-budget-intelligence.json
          PREVIOUS_HEALTH_FILE: ${{ runner.temp }}/previous-source-health.json
        run: npm run data:delta
      - name: Build procurement delta
        env:
          PREVIOUS_BUDGET_FILE: ${{ runner.temp }}/previous-budget-intelligence.json
          PREVIOUS_SAM_FILE: ${{ runner.temp }}/previous-sam-opportunities.json
          PREVIOUS_CONTRACT_MONITOR_FILE: ${{ runner.temp }}/previous-contract-monitor.json
        run: npm run data:procurement-delta
      - name: Audit dependency graph
        run: npm audit --audit-level=high
      - name: Verify registry signatures and attestations
        run: npm audit signatures
      - name: Install browser contract runtime
        run: npx playwright-core install --with-deps chromium
      - name: Verify Cloudflare Pages and D1 account lifecycle
        run: npm run verify:pages-auth
      - name: Verify authenticated Agent API and D1 management lifecycle
        run: npm run verify:agent-api
      - name: Verify complete site and responsive browser contract
        env:
          BUDGET_SOURCE_DIR: ${{ runner.temp }}/defense-budget-intelligence/budget
        run: npm run verify
      - name: Build and start fresh PostgreSQL container stack
        run: docker compose up --build --detach --wait
      - name: Verify stateful PostgreSQL API and browser contract
        run: node scripts/verify-container.mjs
      - name: Inspect container state
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200 app
      - name: Stop fresh container stack
        if: always()
        run: docker compose down --volumes
      - name: Open protected snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/budget-intelligence.json src/data/source-health.json src/data/refresh-delta.json src/data/account-spine.json src/data/sam-opportunities.json src/data/usaspending-subawards.json src/data/procurement-delta.json src/data/procurement-discovery.json src/data/procurement-feed.json src/data/contract-monitor.json; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/daily-intelligence
          git add src/data/budget-intelligence.json src/data/source-health.json src/data/refresh-delta.json src/data/account-spine.json src/data/sam-opportunities.json src/data/usaspending-subawards.json src/data/procurement-delta.json src/data/procurement-discovery.json src/data/procurement-feed.json src/data/contract-monitor.json
          git commit -m "chore(data): refresh budget intelligence snapshots"
          git push --force-with-lease origin HEAD:automation/daily-intelligence
          existing="$(gh pr list --head automation/daily-intelligence --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head automation/daily-intelligence --title "chore(data): refresh daily intelligence" --body "Automated official-source refresh. Merge is gated by the same release, security, and recovery contracts as application changes."
          fi
          gh pr merge automation/daily-intelligence --auto --squash
