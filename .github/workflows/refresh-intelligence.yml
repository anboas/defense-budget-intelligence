name: Refresh intelligence snapshots

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Preserve previous verified snapshots
        run: |
          cp src/data/budget-intelligence.json "${RUNNER_TEMP}/previous-budget-intelligence.json"
          cp src/data/source-health.json "${RUNNER_TEMP}/previous-source-health.json"
      - name: Refresh official sources
        env:
          BUDGET_SOURCE_DIR: ${{ runner.temp }}/defense-budget-intelligence/budget
        run: npm run source:refresh
      - name: Build refresh delta
        env:
          PREVIOUS_BUDGET_FILE: ${{ runner.temp }}/previous-budget-intelligence.json
          PREVIOUS_HEALTH_FILE: ${{ runner.temp }}/previous-source-health.json
        run: npm run data:delta
      - name: Verify generated site
        env:
          BUDGET_SOURCE_DIR: ${{ runner.temp }}/defense-budget-intelligence/budget
        run: npm run lint && npm run build
      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- src/data/budget-intelligence.json src/data/source-health.json src/data/refresh-delta.json src/data/account-spine.json; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/budget-intelligence.json src/data/source-health.json src/data/refresh-delta.json src/data/account-spine.json
          git commit -m "chore(data): refresh budget intelligence snapshots"
          git push origin HEAD:main
      - name: Publish refreshed GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
