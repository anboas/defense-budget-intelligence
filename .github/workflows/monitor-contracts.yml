name: Monitor active and upcoming contracts

on:
  schedule:
    - cron: "32 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-intelligence
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit dependency graph
        run: npm audit --audit-level=high
      - name: Preserve previous daily snapshots
        run: |
          cp src/data/sam-opportunities.json "$RUNNER_TEMP/previous-sam-opportunities.json"
          cp src/data/contract-monitor.json "$RUNNER_TEMP/previous-contract-monitor.json"
      - name: Refresh official contract observations
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          PREVIOUS_SAM_FILE: ${{ runner.temp }}/previous-sam-opportunities.json
          PREVIOUS_CONTRACT_MONITOR_FILE: ${{ runner.temp }}/previous-contract-monitor.json
        run: npm run source:sam && npm run source:contracts && npm run data:procurement-delta
      - name: Verify generated runtime and UI contracts
        run: npm run lint && npm run verify:ui-conformance && npm run build
      - name: Commit changed contract observations
        run: |
          if git diff --quiet -- src/data/sam-opportunities.json src/data/contract-monitor.json src/data/procurement-delta.json src/data/procurement-discovery.json; then
            echo "No contract-monitor changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sam-opportunities.json src/data/contract-monitor.json src/data/procurement-delta.json src/data/procurement-discovery.json
          git commit -m "chore(data): refresh daily acquisition feed"
          git push origin HEAD:main
