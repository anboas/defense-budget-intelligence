name: Recovery assurance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbi-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d1-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Restore oversized D1 export fixture
        run: npm run verify:recovery:d1

  postgresql-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Build application and PostgreSQL images
        run: docker compose build app db
      - name: Restore PostgreSQL into a second isolated database
        run: npm run verify:recovery:postgres
      - name: Stop recovery stack
        if: always()
        run: docker compose down --volumes
