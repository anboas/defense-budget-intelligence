name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbi-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Build and start container stack
        run: docker compose up --build --detach --wait
      - name: Verify stateful API contract
        run: node scripts/verify-container.mjs
      - name: Start PostgreSQL authentication contract
        run: docker compose run --rm --detach --name dbi-auth-contract -e ENABLE_AUTH=true -e AUTH_REQUIRE_LOGIN=true -e AUTH_SECURE_COOKIE=false -e DBI_CREDENTIAL_ENCRYPTION_KEY=verification-only-encryption-material-0001 -e DBI_EVENT_AI_MOCK_MODE=true -e PORT=8081 -p 18081:8081 app
      - name: Verify PostgreSQL workspace and account lifecycle
        run: npm run verify:postgres-auth
      - name: Inspect container state
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200 app
      - name: Stop container stack
        if: always()
        run: |
          docker rm --force dbi-auth-contract 2>/dev/null || true
          docker compose down --volumes

  deploy:
    needs: container-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit dependency graph
        run: npm audit --audit-level=high
      - name: Build CycloneDX SBOM
        run: mkdir -p test-results/security && npm sbom --sbom-format=cyclonedx > test-results/security/defense-budget-intelligence.sbom.cdx.json
      - name: Install browser contract runtime
        run: npx playwright-core install --with-deps chromium
      - name: Verify Cloudflare Pages and D1 account lifecycle
        run: npm run verify:pages-auth
      - name: Verify authenticated Agent API and D1 management lifecycle
        run: npm run verify:agent-api
      - name: Verify and build
        run: npm run verify
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dbi-security-evidence
          path: test-results/security
          if-no-files-found: warn
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
