services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: defense-budget-intelligence-postgres
    environment:
      POSTGRES_DB: budget_intelligence
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 12
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,uid=70,gid=70,mode=3775,size=16m
    volumes:
      - budget_intelligence_db:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://postgres@db:5432/budget_intelligence
      ENABLE_WRITES: "false"
      ENABLE_AUTH: "false"
      AUTH_REQUIRE_LOGIN: "false"
      ALLOW_FIRST_CLAIM: "true"
      ALLOW_SELF_REGISTRATION: "false"
      AUTH_SECURE_COOKIE: "false"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
      - ALL
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${BUDGET_APP_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  budget_intelligence_db:
