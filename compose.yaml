services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: budget_intelligence
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - budget_intelligence_db:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://postgres@db:5432/budget_intelligence
      ENABLE_WRITES: "false"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  budget_intelligence_db:
