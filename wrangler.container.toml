name = "defense-intelligence"
main = "cloudflare/worker.js"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "intel.adamboas.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[containers]]
name = "dbi-app"
class_name = "AppContainer"
image = "./Dockerfile"
max_instances = 1
instance_type = "basic"

[[durable_objects.bindings]]
name = "APP_CONTAINER"
class_name = "AppContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppContainer"]

[observability]
enabled = true

[vars]
ALLOW_FIRST_CLAIM = "true"
